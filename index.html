<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momen Pernyataan Cinta</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffe4e1, #ffb6c1, #ffdab9, #ffe4e1);
            background-size: 400% 400%;
            animation: gradientShift 10s ease infinite;
            color: #333;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: background 0.5s ease;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .floating-hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart-particle {
            position: absolute;
            font-size: 16px;
            color: rgba(255, 182, 193, 0.4);
            animation: floatUp 12s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        .container {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
            z-index: 2;
            position: relative;
            max-width: 500px;
            width: 90%;
            animation: entrance 1.5s ease-out;
            transition: transform 0.5s ease;
        }

        @keyframes entrance {
            0% { opacity: 0; transform: translateY(50px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .container.expanded {
            transform: scale(1.05);
        }

        .heart {
            font-size: 100px;
            color: #ff69b4;
            animation: heartbeat 1.5s ease-in-out infinite, scaleIn 1s ease-out;
            margin-bottom: 20px;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes scaleIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        #message {
            font-family: 'Dancing Script', cursive;
            font-size: 2em;
            color: #ff1493;
            margin-bottom: 30px;
            white-space: nowrap;
            border-right: 2px solid #ff1493;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { border-color: transparent; }
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        button {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1em;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        #yes-btn {
            background: linear-gradient(45deg, #ff69b4, #ffb6c1);
            color: white;
        }

        #yes-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.4);
            filter: drop-shadow(0 0 10px rgba(255, 105, 180, 0.6));
        }

        #no-btn {
            background: linear-gradient(45deg, #ffa07a, #ffcccb);
            color: white;
        }

        #no-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 160, 122, 0.4);
            filter: drop-shadow(0 0 10px rgba(255, 160, 122, 0.6));
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            display: none;
        }

        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .popup-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .popup {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: 1.5em;
            color: #ff1493;
            max-width: 400px;
            animation: popupAnim 0.5s ease-out;
        }

        @keyframes popupAnim {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 768px) {
            .heart {
                font-size: 70px;
            }
            #message {
                font-size: 1.5em;
            }
            button {
                font-size: 1em;
                padding: 12px 25px;
            }
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            .container {
                padding: 20px;
            }
            #popup-overlay {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floating-hearts"></div>
    <div class="container" id="main-card">
        <div class="heart">❤️</div>
        <div id="message"></div>
        <div class="buttons">
            <button id="yes-btn">Ya, aku juga mencintaimu 💖</button>
            <button id="no-btn">Tidak 😅</button>
        </div>
    </div>

    <canvas id="confetti-canvas"></canvas>

    <div class="popup-overlay" id="popup-overlay">
        <div class="popup">
            Sekarang kita resmi jadi pasangan paling gemas di dunia 🥰💍
        </div>
    </div>

    <audio id="bg-music" loop volume="0.2">
        <source src="assets/1.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        const message = document.getElementById('message');
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const floatingHearts = document.getElementById('floating-hearts');
        const confettiCanvas = document.getElementById('confetti-canvas');
        const ctx = confettiCanvas.getContext('2d');
        const popupOverlay = document.getElementById('popup-overlay');
        const mainCard = document.getElementById('main-card');
        const bgMusic = document.getElementById('bg-music');

        function resizeCanvas() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Mulai musik latar saat klik halaman (karena autoplay diblokir browser)
        let musicStarted = false;
        document.addEventListener('click', function() {
            if (!musicStarted) {
                bgMusic.play().catch(() => {});
                musicStarted = true;
            }
        });
        const fullText = "Aku mencintaimu lebih dari apapun ❤️";
        let charIndex = 0;
        function typeWriter() {
            if (charIndex < fullText.length) {
                message.textContent += fullText.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 100);
            }
        }
        setTimeout(typeWriter, 1500); 

        function createFloatingHearts() {
            for (let i = 0; i < 8; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.textContent = '💖';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 12 + 's';
                floatingHearts.appendChild(heart);

                setTimeout(() => heart.remove(), 12000);
            }
        }
        createFloatingHearts();
        setInterval(createFloatingHearts, 10000);

        let confettiParticles = [];
        const colors = ['#ff69b4', '#ffb6c1', '#ffcccb', '#ffe4e1'];

        function createConfetti() {
            for (let i = 0; i < 100; i++) {
                confettiParticles.push({
                    x: Math.random() * confettiCanvas.width,
                    y: Math.random() * confettiCanvas.height - confettiCanvas.height,
                    vx: (Math.random() - 0.5) * 8,
                    vy: Math.random() * 3 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 6 + 4
                });
            }
        }

        function updateConfetti() {
            confettiParticles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1;
                if (p.y > confettiCanvas.height) {
                    p.y = -p.size;
                    p.x = Math.random() * confettiCanvas.width;
                }
            });
        }

        function drawConfetti() {
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            confettiParticles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
        }

        function animateConfetti() {
            updateConfetti();
            drawConfetti();
            requestAnimationFrame(animateConfetti);
        }
        animateConfetti();

        yesBtn.addEventListener('click', function() {
            document.body.style.background = 'linear-gradient(135deg, #fff0f5, #ffb6c1, #ffc0cb, #fff0f5)';

            confettiCanvas.style.display = 'block';
            createConfetti();

            mainCard.classList.add('expanded');

            popupOverlay.classList.add('show');
            setTimeout(() => {
                popupOverlay.classList.remove('show');
            }, 4000);
            const phoneNumber = "+6282152005836";
            const whatsappMessage = "Aku mencintaimu lebih dari kata-kata ❤️";
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(whatsappMessage)}`;
            window.open(whatsappUrl, '_blank');
        });

        noBtn.addEventListener('mouseover', function() {
            const maxX = window.innerWidth - noBtn.offsetWidth - 40;
            const maxY = window.innerHeight - noBtn.offsetHeight - 40;
            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;
            noBtn.style.position = 'absolute';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
        });

        noBtn.addEventListener('click', function() {
            const maxX = window.innerWidth - noBtn.offsetWidth - 40;
            const maxY = window.innerHeight - noBtn.offsetHeight - 40;
            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
        });
    </script>
</body>
</html>
